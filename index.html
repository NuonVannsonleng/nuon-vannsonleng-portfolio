<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio of Nuon Vannsonleng — IT Engineering student at the Royal University of Phnom Penh, showcasing skills and projects in web development, design, and media."
    />
    <meta name="author" content="Nuon Vannsonleng" />
    <link rel="icon" type="image/jpeg" href="/profile.jpg" />
    <link rel="apple-touch-icon" href="/profile.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#f7f5ef" />
    <script>
      /* Paint the saved theme before first paint so the page never flashes
         the wrong palette. Mirrors the logic in src/hooks/useTheme.ts. */
      (function () {
        try {
          var mode = localStorage.getItem('theme') || 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          if (dark) {
            document.querySelector('meta[name="theme-color"]').content = '#0a1725';
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <title>Nuon Vannsonleng | Developer Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
